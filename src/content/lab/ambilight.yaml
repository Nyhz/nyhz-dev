title: Ambilight
summary: Each edge of the picture glows its own colour round the set, like the Philips TVs.
how: |-
  The cover is drawn into a 32×20 canvas: 640 pixels is plenty to know what colour an edge is. Each edge band, a fifth of the picture deep, is averaged into one colour.

  A dark cover would glow black and a white one would glare, so the colour goes through HSL: lightness held between 34% and 62%, saturation pushed up a little.

  The glow is four box-shadows, one per side, and box-shadow transitions — so changing channel fades the light from one picture's colours to the next.
tags:
  - canvas
  - css
code: |-
  ctx.drawImage(cover, 0, 0, 32, 20);
  const [l, t, r, b] = edges(ctx.getImageData(0, 0, 32, 20).data, 32, 20)
    .map((c) => glow(c)); // hsl, lightness kept in a band
  glass.style.boxShadow = [
    `-24px 0 64px -20px ${l}`, `0 -24px 64px -20px ${t}`,
    `24px 0 64px -20px ${r}`, `0 24px 64px -20px ${b}`,
  ].join(', ');
lang: ts
source: https://github.com/Nyhz/nyhz-dev/blob/main/src/scripts/ambilight.ts
