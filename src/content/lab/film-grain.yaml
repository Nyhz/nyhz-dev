title: Film grain
summary: The page's background — grain, a light that follows you, ripples on click — in one fragment shader.
how: |-
  The whole effect is one quad and one fragment shader in plain WebGL. It used to be three.js; for two triangles that was 128 KB gzipped, now it's a few hundred lines of nothing.

  The grain dithers the soft gradients underneath it, so they never band. The classic fract(sin(dot())) hash fell apart after about fifteen seconds on real GPUs — sin() loses precision as its input grows — so it's a sin-free hash, fed a frame counter that wraps.

  Clicks are four ring slots in a uniform array: origin, age and strength. The shader draws an expanding band of brighter static for each, fading as it ages.
tags:
  - webgl
  - glsl
code: |-
  // sin-free hash — well-conditioned for large coords
  float hash(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
  }
  // the frame counter wraps, so the hash input never grows
  float t = mod(floor(uTime * 24.0), 64.0);
  float n = hash(gl_FragCoord.xy + t * vec2(31.7, 13.1)) - 0.5;
lang: glsl
source: https://github.com/Nyhz/nyhz-dev/blob/main/src/scripts/grain.ts
