title: DVD bounce
summary: The screensaver everyone waited on — and the corner it almost never hits.
how: |-
  Constant speed, and a wall flips one component of the velocity. A corner is just both walls in the same frame, which is why it's so rare: it takes the right angle and the right box size at once.

  The trail is free. Instead of clearing the canvas, each frame paints a translucent black over the last one, so old frames fade instead of vanishing.

  On this site it's the real screensaver: leave the page alone for thirty seconds and the name peels off the hero and does this.
tags:
  - canvas
code: |-
  x += vx * speed * dt; y += vy * speed * dt;
  let hx = false, hy = false;
  if (x <= 0) { x = 0; vx = 1; hx = true; } else if (x + w >= W) { x = W - w; vx = -1; hx = true; }
  if (y <= 0) { y = 0; vy = 1; hy = true; } else if (y + h >= H) { y = H - h; vy = -1; hy = true; }
  if (hx && hy) corners++; // the moment everyone waits for
